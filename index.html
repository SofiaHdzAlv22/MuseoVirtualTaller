<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Museo Virtual Indígena VR</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <script>
    // =====================================================================
    // TELETRANSPORTE AL MIRAR UNA OBRA
    // Uso:  gaze-teleport="to: x 0 z; look: x y z"
    //   to   = dónde queda parado el visitante (coordenadas del mundo)
    //   look = punto hacia el que queda mirando (la obra)
    // El tiempo de mirada se cambia en el cursor (fuse-timeout, en milisegundos).
    // =====================================================================
    var enMovimiento = false;

    function teletransportar(destino, mira) {
      var rig = document.getElementById('rig');
      var cam = document.getElementById('camara');
      var fundido = document.getElementById('fundido');
      if (enMovimiento) return;

      // si ya está parado en ese lugar, no hace nada
      var pos = rig.object3D.position;
      if (Math.hypot(pos.x - destino.x, pos.z - destino.z) < 0.1) return;

      enMovimiento = true;
      fundido.emit('apagar');                      // pantalla se oscurece

      setTimeout(function () {
        // mueve al visitante
        rig.object3D.position.set(destino.x, 0, destino.z);

        // lo gira para que quede mirando de frente a la obra
        var yaw = Math.atan2(-(mira.x - destino.x), -(mira.z - destino.z));
        rig.object3D.rotation.y = yaw - cam.object3D.rotation.y;

        fundido.emit('encender');                  // pantalla vuelve a aclararse
        setTimeout(function () { enMovimiento = false; }, 500);
      }, 380);
    }

    AFRAME.registerComponent('gaze-teleport', {
      schema: {
        to:   { type: 'vec3' },
        look: { type: 'vec3' }
      },
      init: function () {
        var el = this.el;
        var self = this;
        // el cursor emite "click" cuando se cumple el tiempo de mirada
        el.addEventListener('click', function () {
          teletransportar(self.data.to, self.data.look);
        });
      }
    });
  </script>
</head>

  <!-- ============ VISITANTE ============
       "rig" es el cuerpo del visitante (es lo que se teletransporta).
       "camara" es la cabeza (look-controls). El cursor se activa al mirar un objeto:
       fuse-timeout = TIEMPO DE MIRADA para teletransportarse (1500 = 1.5 segundos). -->
  <a-entity id="rig" position="0 0 3.5">
    <a-entity id="camara" camera look-controls position="0 1.6 0">
      <a-cursor fuse="true" fuse-timeout="1500" raycaster="objects: .interactable"
                color="#e6b34a" geometry="radiusInner: 0.015; radiusOuter: 0.025"></a-cursor>

      <!-- cortina negra para el efecto de fundido al teletransportarse -->
      <a-plane id="fundido" position="0 0 -0.2" width="4" height="4"
               material="shader: flat; color: #000; transparent: true; opacity: 0; depthTest: false; depthWrite: false"
               animation__apagar="property: material.opacity; to: 1; dur: 350; easing: easeInQuad; startEvents: apagar"
               animation__encender="property: material.opacity; to: 0; dur: 450; easing: easeOutQuad; startEvents: encender"></a-plane>
    </a-entity>
  </a-entity>

  <!-- LUCES GENERALES -->

  <a-light type="hemisphere" color="#ffe9cc" ground-color="#3a2a1a" intensity="0.35"></a-light>

  <!-- SALA: suelo, techo y 4 paredes -->

  <a-box position="0 2 -5" width="10" height="4" depth="0.1" material="src: #tex-pared; repeat: 2 1" color="#b7a995"></a-box>
  <a-box position="0 2 5" width="10" height="4" depth="0.1" material="src: #tex-pared; repeat: 2 1" color="#b7a995"></a-box>
  <a-box position="-5 2 0" width="0.1" height="4" depth="10" material="src: #tex-pared; repeat: 2 1" color="#b7a995"></a-box>
  <a-box position="5 2 0" width="0.1" height="4" depth="10" material="src: #tex-pared; repeat: 2 1" color="#b7a995"></a-box>

  <a-plane position="0 0.01 -0.5" rotation="-90 0 0" width="3.2" height="6.8" material="src: #tex-alfombra; repeat: 1 2" color="#5a4332"></a-plane>
